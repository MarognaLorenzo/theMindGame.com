name: Deploy Worker

# The frontend (Cloudflare Pages) auto-deploys on push via Pages' own Git
# integration. The Worker has no such integration, so this workflow mirrors it:
#   - push to `main`            -> deploy the production Worker
#   - push to any other branch  -> deploy the shared `-preview` Worker
# Only runs when backend-relevant files change (see `paths` below).

on:
  push:
    branches: ['**']
    paths:
      - 'worker/**'
      - 'migrations/**'
      - 'wrangler.toml'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-worker.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Serialize by target environment, not by branch: every non-main branch
    # deploys to the SAME preview Worker/D1, so two different feature branches
    # pushing close together would otherwise race against that shared target.
    # Production gets its own group so a preview deploy never waits on it.
    concurrency:
      group: deploy-worker-${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    # CLOUDFLARE_API_TOKEN is scoped to the deploy steps only, not the job. It can
    # `wrangler deploy` and run D1 migrations, so it must not be in scope during
    # `npm ci`, whose dependency lifecycle scripts are the largest slice of
    # untrusted third-party code this workflow runs. CLOUDFLARE_ACCOUNT_ID is a
    # plain account identifier (not a secret), so it stays at job level.
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Gate: fail the deploy if the worker (or anything else) doesn't typecheck.
      - run: npx tsc --noEmit

      - name: Deploy production Worker
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler d1 migrations apply the-mind-game-leaderboard --remote
          npx wrangler deploy

      - name: Deploy preview Worker
        if: github.ref != 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler d1 migrations apply the-mind-game-leaderboard-preview --remote --env preview
          npx wrangler deploy --env preview
