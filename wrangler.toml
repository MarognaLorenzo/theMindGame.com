name = 'the-mind-game-worker'
main = "worker/index.ts"
compatibility_date = "2026-03-07"

[[durable_objects.bindings]]
name = "LOBBY_SERVER"
class_name = "LobbyServer"

[[durable_objects.bindings]]
name = "LOBBY_REGISTRY"
class_name = "LobbyRegistry"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LobbyServer"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["LobbyRegistry"]

[[d1_databases]]
binding = "DB"
database_name = "the-mind-game-leaderboard"
database_id = "7c52f09e-308d-47c9-b357-267df4857236"
migrations_dir = "migrations"

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "the-mind-game-events"

[vars]
ALLOWED_ORIGINS = "https://themindgameonline3-0-pages.pages.dev,http://localhost:3000,https://themindgame.app,https://the-mind-game.com,*.themindgameonline3-0-pages.pages.dev"
PUBLIC_BASE_URL = "https://the-mind-game-worker.lmarogna02.workers.dev"

# Isolated preview deployment: Workers Preview URLs don't support Durable
# Objects, so this is the workaround - a separate, distinctly-named Worker
# with its own DO namespace, deployed via `wrangler deploy --env preview`.
# Also uses its own dedicated D1 database (not the top-level one production
# will use) so preview/test data never mixes with real production data.
# Bindings/migrations are NOT inherited from the top-level config by named
# environments, so everything is re-declared below.
[env.preview]
name = "the-mind-game-worker-preview"

[[env.preview.durable_objects.bindings]]
name = "LOBBY_SERVER"
class_name = "LobbyServer"

[[env.preview.durable_objects.bindings]]
name = "LOBBY_REGISTRY"
class_name = "LobbyRegistry"

[[env.preview.migrations]]
tag = "v1"
new_sqlite_classes = ["LobbyServer"]

[[env.preview.migrations]]
tag = "v2"
new_sqlite_classes = ["LobbyRegistry"]

[[env.preview.d1_databases]]
binding = "DB"
database_name = "the-mind-game-leaderboard-preview"
database_id = "3dd97588-a562-4b97-a5de-1fbcdedc6643"
migrations_dir = "migrations"

[[env.preview.analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "the-mind-game-events-preview"

[env.preview.vars]
ALLOWED_ORIGINS = "https://themindgameonline3-0-pages.pages.dev,http://localhost:3000,https://themindgame.app,https://the-mind-game.com,*.themindgameonline3-0-pages.pages.dev"
PUBLIC_BASE_URL = "https://the-mind-game-worker-preview.lmarogna02.workers.dev"